<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ecosystem Web Components</title>
    <script type="module" src="https://react.seam.co/v/5.1.1/dist/ecosystem.js"></script>
    <style>
      main {
        display: grid;
        gap: 48px;
        max-width: 960px;
        margin: 0 auto;
        padding: 24px;
      }
    </style>
  </head>
  <body>
    <main>
      <seam-supported-devices
        embed-key="eco_live_your_embed_key"
        manufacturer="schlage"
      ></seam-supported-devices>
      <seam-compatible-apps
        embed-key="eco_live_your_embed_key"
        device-type="smartlock"
        manufacturer="schlage"
      ></seam-compatible-apps>
    </main>
  </body>
</html>
